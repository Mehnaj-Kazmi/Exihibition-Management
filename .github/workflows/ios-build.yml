# Builds the iPhone app on GitHub's Mac machines.
#
# Apple permits iOS compilation only on macOS, so no Windows PC can produce an
# iPhone build. GitHub hosts real Apple hardware and runs this file on it —
# free and unlimited on a public repository, which this one is.
#
# Two jobs:
#   * simulator     — proves the iPhone app compiles. Needs no Apple account.
#   * unsigned-ipa  — produces an .ipa installable on your OWN iPhone with a
#                     free Apple ID via Sideloadly. See README-ios.md.

name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/Exb.Mobile/**'
      - 'src/Exb.Mobile.Shared/**'
      - '.github/workflows/ios-build.yml'

env:
  # The Razor source generator emits CS8669 on its own generated files; left
  # alone it crowds the real error out of the annotation list that this
  # workflow's failure reporting depends on.
  NOWARN: CS8669

jobs:
  simulator:
    name: Simulator build (compile check)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select a real, installed Xcode
        run: |
          # The image sets DEVELOPER_DIR to an Xcode that is not present on
          # disk, and DEVELOPER_DIR silently overrides `xcode-select`, so the
          # toolchain went looking for actool inside a directory that does not
          # exist ("unable to find utility actool"). Pick the newest Xcode that
          # genuinely is installed and export DEVELOPER_DIR for later steps.
          echo "::notice::inherited DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
          PICK=""; BEST=""
          for x in /Applications/Xcode*.app; do
            [ -x "$x/Contents/Developer/usr/bin/xcodebuild" ] || continue
            v=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
            [ -n "$v" ] || continue
            echo "::notice::installed $x = Xcode $v"
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST" "$v" | sort -V | tail -1)" = "$v" ]; then
              BEST="$v"; PICK="$x"
            fi
          done
          if [ -z "$PICK" ]; then echo "::error::No usable Xcode found"; exit 1; fi
          echo "::notice::selected $PICK (Xcode $BEST)"
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version

      - name: Install the MAUI iOS workload
        run: |
          dotnet workload install maui-ios
          echo "::notice::dotnet SDK $(dotnet --version)"
          echo "::notice::DEVELOPER_DIR is now ${DEVELOPER_DIR:-unset}"

      - name: Build for the iOS Simulator
        run: |
          set +e
          dotnet build src/Exb.Mobile/Exb.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworksOverride=net10.0-ios \
            -p:RuntimeIdentifier=iossimulator-arm64 \
            -p:NoWarn=$NOWARN \
            --nologo 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -aE "error [A-Z]+[0-9]+|error :|error:" build.log | sort -u | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::iOS simulator build failed with exit code $code"
          fi
          exit $code

  unsigned-ipa:
    name: Unsigned .ipa (sideload to your own iPhone)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select a real, installed Xcode
        run: |
          echo "::notice::inherited DEVELOPER_DIR=${DEVELOPER_DIR:-unset}"
          PICK=""; BEST=""
          for x in /Applications/Xcode*.app; do
            [ -x "$x/Contents/Developer/usr/bin/xcodebuild" ] || continue
            v=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1 | awk '{print $2}')
            [ -n "$v" ] || continue
            if [ -z "$BEST" ] || [ "$(printf '%s\n%s\n' "$BEST" "$v" | sort -V | tail -1)" = "$v" ]; then
              BEST="$v"; PICK="$x"
            fi
          done
          if [ -z "$PICK" ]; then echo "::error::No usable Xcode found"; exit 1; fi
          echo "::notice::selected $PICK (Xcode $BEST)"
          echo "DEVELOPER_DIR=$PICK/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$PICK/Contents/Developer"
          xcodebuild -version

      - name: Install the MAUI iOS workload
        run: dotnet workload install maui-ios

      # Builds for a real device (ios-arm64) with signing switched off.
      # Sideloadly re-signs it afterwards with the tester's own free Apple ID,
      # which is what makes the no-paid-account route work.
      - name: Build unsigned for device
        run: |
          set +e
          dotnet build src/Exb.Mobile/Exb.Mobile.csproj \
            -f net10.0-ios \
            -c Release \
            -p:TargetFrameworksOverride=net10.0-ios \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:CodesignKey="" \
            -p:CodesignProvision="" \
            -p:EnableCodeSigning=false \
            -p:_RequireCodeSigning=false \
            -p:DisableCodesignVerification=true \
            -p:NoWarn=$NOWARN \
            --nologo 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            grep -aE "error [A-Z]+[0-9]+|error :|error:" build.log | sort -u | head -8 \
              | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::iOS device build failed with exit code $code"
          fi
          exit $code

      # An .ipa is a zip containing a Payload/ folder with the .app inside, so
      # one can be assembled by hand without Xcode's archive step.
      - name: Package as .ipa
        run: |
          APP=$(find src/Exb.Mobile/bin/Release/net10.0-ios -maxdepth 3 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app bundle was produced."
            find src/Exb.Mobile/bin/Release/net10.0-ios -maxdepth 3 -type d
            exit 1
          fi
          echo "Found app bundle: $APP"
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ExhibitionCompanion.ipa Payload
          ls -lh ExhibitionCompanion.ipa

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ExhibitionCompanion-iOS-unsigned-ipa
          path: out/ExhibitionCompanion.ipa
          if-no-files-found: error
